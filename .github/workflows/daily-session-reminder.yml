name: Daily Session Reminder

# Manual only. This workflow pokes a deployed personal instance, which a public
# clone does not have - a schedule here would fail on every run. Self-hosters:
# set the APP_URL and INTERNAL_NOTIFY_SECRET repository secrets, then add
#
#   schedule:
#     - cron: "0 8 * * *"
#
# back once a manual run has succeeded.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger daily session reminder
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "::error::APP_URL and INTERNAL_NOTIFY_SECRET must both be set."
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/internal/daily-session" \
            -H "x-internal-secret: $SECRET"
