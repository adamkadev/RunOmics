name: Sync Garmin Activities

# Manual only. This repository ships no Garmin credentials and no private data
# repository, so there is nothing for a schedule to sync - a cron here would just
# fail every night. Self-hosters: configure the secrets below, then add your own
#
#   schedule:
#     - cron: "0 0 * * *"
#
# once a manual run has succeeded.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new activities to sync (leave empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (fetch but don't write)"
        type: boolean
        default: false
      force:
        description: "Re-sync all activities (rebuilds every record)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Nothing is ever written back to this repository: the synced dataset goes to
    # the private data repository over HTTPS, with its own token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the sync configuration
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
        run: |
          MISSING=""
          [ -n "$RUNOMICS_DATA_REPO_URL" ]   || MISSING="$MISSING RUNOMICS_DATA_REPO_URL"
          [ -n "$RUNOMICS_DATA_REPO_TOKEN" ] || MISSING="$MISSING RUNOMICS_DATA_REPO_TOKEN"
          [ -n "$GARMIN_SECRET" ]            || MISSING="$MISSING GARMIN_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING"
            echo "This workflow syncs Garmin into a *private* data repository and never"
            echo "commits anything back here. See README > 'Personal deployment: Garmin sync'."
            exit 1
          fi

      - name: Fetch current private data
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: node scripts/fetch_private_data.mjs public/data

      - name: Restore FIT cache
        uses: actions/cache@v6
        with:
          path: public/fit
          key: fit-${{ hashFiles('public/data/activities/**') }}
          restore-keys: |
            fit-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status

      - name: Run sync
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/sync.py $ARGS

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      - name: Backfill missing weather
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: python scripts/backfill_weather.py

      - name: Push updated data to the private data repository
        id: commit
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: |
          # The deployment marker the post-sync step waits for. sync.py always
          # rewrites this file, so it is read locally before anything is pushed.
          python -c "import json; print('last_synced_at=' + json.load(open('public/data/sync_meta.json'))['lastSyncedAt'])" >> "$GITHUB_OUTPUT"

          OUTPUT=$(node scripts/push_private_data.mjs public/data)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "No data changes"; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "committed=true" >> "$GITHUB_OUTPUT"
            if echo "$OUTPUT" | grep -q "refresh last-synced timestamp"; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger deploy hook
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set - skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Trigger post-sync checks
        if: steps.commit.outputs.data_changed == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          EXPECTED_SYNC: ${{ steps.commit.outputs.last_synced_at }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "APP_URL / INTERNAL_NOTIFY_SECRET not set - skipping post-sync checks."
            exit 0
          fi

          # Everything these endpoints read comes off the build's own filesystem,
          # so they answer for whatever deployment is live - and the previous one
          # answers 200 within a second of the push above, while the new build is
          # still going. Waiting on a bare 200 therefore ran every check against
          # the data as it was *before* this sync: the insight generator saw no
          # new activity, reported "outstanding: 0", and the run it had just
          # synced had to wait for the next night to get its verdict.
          #
          # Wait for the deployment carrying this run's own sync timestamp.
          DEPLOYED=false
          for i in $(seq 1 24); do
            LIVE=$(curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H "x-internal-secret: $SECRET" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('lastSyncedAt') or '')" 2>/dev/null || true)
            if [ -n "$EXPECTED_SYNC" ] && [ "$LIVE" = "$EXPECTED_SYNC" ]; then
              DEPLOYED=true
              echo "Deployment carrying $EXPECTED_SYNC is live after $(((i - 1) * 15))s."
              break
            fi
            sleep 15
          done
          if [ "$DEPLOYED" != "true" ]; then
            echo "::warning::App still serving pre-sync data after 6 min (live: ${LIVE:-none}, expected: $EXPECTED_SYNC). Running the checks anyway."
          fi

          # No check may take another one down with it. They are independent, and
          # a 504 on one of these used to abort the step under `bash -e` - which
          # is how a slow ai-insights pass silently cancelled the two passes
          # queued behind it. Every endpoint here is idempotent: what a failed
          # call leaves undone, the next run picks up.
          check() {
            curl -fsS --max-time "${2:-90}" -X POST "$APP_URL/api/internal/$1" -H "x-internal-secret: $SECRET" \
              || echo "::warning::$1 failed"
            echo
          }

          check pr-check
          check shoe-wear-check
          check overreaching-check
          check activity-sync-check

          # Each pass regenerates a surface only if its facts moved (a Firestore
          # read, no spend) and backfills another batch of run verdicts, without
          # any single request outliving the serverless function budget (300s -
          # see maxDuration in the route). curl gets more rope than that ceiling,
          # or the connection closes before the function does and the response -
          # and its "no time left" diagnostics - never comes back.
          #
          # Five passes rather than one: a single 503 (model-side capacity) or a
          # slow model still costs a pass without progress, and a big run-verdict
          # backfill can span more than one pass on its own. A pass where
          # everything is already current costs a handful of reads.
          for i in 1 2 3 4 5; do
            check ai-insights 310
          done
